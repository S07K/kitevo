name: Feature request
description: Suggest an idea or improvement for Kitevo.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For open-ended ideas, [Discussions](https://github.com/S07K/kitevo/discussions) may be a better first stop.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and who runs into it (creators, brands, self-hosters, contributors).
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web
        - iOS app
        - Android app
        - Self-hosting / developer experience
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
